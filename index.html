<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>10-Б — Розклад уроків</title>
    <meta
      name="description"
      content="Розклад уроків 10-Б, Ліцей №11 Івано-Франківської міської ради: що зараз, скільки лишилось і який урок далі."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" />

    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="10-Б" />
    <meta name="application-name" content="10-Б" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="10-Б — Розклад уроків" />
    <meta
      property="og:description"
      content="Що зараз, скільки лишилось і який урок далі. Працює офлайн."
    />

    <script>
      // Ставимо тему до першого малювання, щоб не блимнути білим.
      ;(function () {
        try {
          var saved = localStorage.getItem('rozklad-10b:theme:v1')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0d0f14' : '#f4f5f7')
        } catch (e) {
          /* приватний режим — обійдемось системною темою */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Щоб побачити розклад, увімкніть JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
