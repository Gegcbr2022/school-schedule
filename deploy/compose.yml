# Перенесення на VPS цілком:
#
#   DOMAIN=dzvinka.app docker compose -f deploy/compose.yml up -d --build
#
# Локально, без домену й HTTPS:
#
#   DOMAIN=:80 docker compose -f deploy/compose.yml up --build
#
# Більше нічого налаштовувати не треба: сертифікат Caddy візьме сам,
# щойно DOMAIN вкаже на цю машину.
#
# Розклад лежить усередині образу — зібраний із тих самих даних, що й усе
# інше, тож він завжди на місці й завжди відповідає коду. Змінився
# розклад — `up -d --build` заново, це менше хвилини.
#
# Треба підмінити розклад просто зараз, без перезбирання:
#
#   docker compose -f deploy/compose.yml cp school.json web:/srv/data/school.json
#
# Підміна живе до наступного перезбирання — далі файл знову береться з
# репозиторію. Томом це навмисно не зроблено: порожня тека перекрила б
# розклад із образу, і сервер віддавав би 404 замість нього.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Без нього сайт працює, просто повільніше на поганій мережі.
      - '443:443/udp'
    volumes:
      # Сертифікати мають пережити перескладання образу, інакше Let's
      # Encrypt швидко впреться в ліміт на видачу.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
