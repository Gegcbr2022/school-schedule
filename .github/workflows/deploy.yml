name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно тримаємо лише один деплой; зайві черги скасовуємо.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Перевірка типів, лінт і тести
        run: |
          npx tsc -b
          npm run lint
          npm test

      # Адреса стану тривоги — не секрет: це публічний файл, який однаково
      # читають усі телефони. Немає її — сайт просто збереться без розділу
      # тривоги, мовчки й без помилок. Звідки вона береться — worker/README.md.
      - run: npm run build
        env:
          VITE_ALERTS_URL: https://pub-58a1b7943a104948a240730aaa5eb54a.r2.dev/alerts.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
